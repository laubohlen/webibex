[pytest]
python_files = test_*.py
testpaths = tests
markers =
    spec(ref): links test to specification section
    moto_s3: test uses the in-process moto S3 mock (see tests/conftest.py::moto_b2)
    live_b2: reserved for a future real-Backblaze-B2 integration tier (scaffold only, no tests currently use this)
    live_pg_restore: reserved for the real Postgres/pg_restore/Docker restore-drill integration tier (T30-I/T40-I/T45-I) -- needs Docker + real postgresql-client binaries + real Railway network, none available in this sandbox; run manually once unblocked
addopts = --cov=core --cov=simple_landmarks --cov=webibex --cov-report=term-missing
